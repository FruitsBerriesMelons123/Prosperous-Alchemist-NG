; ============================================================================
; Prosperous Alchemist NG - Default profile configuration
; ============================================================================

; Each nonzero Skyrim Character ID appears once and maps to the last-used profile.
; The plugin updates this section automatically when a profile is selected.
; An unmapped character receives a new blank profile automatically.
; This section is kept first by the plugin when it saves the file.
[Profiles]

; Example mappings (uncomment and replace with real Character IDs as needed):
; 123456 = Profile 1
; 789012 = Profile 3

[Profile 1]

; Player-editable profile name. It must be unique across all profiles.
ProfileName = Profile 1

; Native Skyrim Character ID. The plugin fills this from the active save.
CharacterID = 0

; Visible Skyrim character identity is filled when this profile is bound to a game.
Name =
Race =
RaceID =
Gender =

IgnorePlayer = 0
ProtectIngredients = 0
Singlethreaded = 0
CacheDurationSeconds = 180
StaleRecalculateThresholdMs = 500
CraftDebounceMs = 400
FilterPotionsBySelectedIngredients = 1

; Character-specific protection and tracking settings.
ProtectedIngredients =
ManualProtectionOnly = 0
ProtectedEffects = MagicAlchFortifyEnchanting,MagicAlchFortifySmithing
ProtectedEffectCounts =
Requirements = {"nextManualId":1,"manual":[],"overrides":[]}

; Set to 1 to force the lowest-numbered flagged profile for every character.
singleprofile = 0

; Set to 1 to enable the developer UI in-game.
developer = 0
autoprovision =

; Localization and window layout are also profile-specific.
Language =
PositionX = -1
PositionY = -1
Width = -1
Height = -1

; Managed runtime snapshots. The plugin refreshes these when live data exists.
Player = {}
CACO =
AlchemyPlus =
